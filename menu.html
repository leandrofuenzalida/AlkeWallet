<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Digital - Menú Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4">
            <p class="text-center text-primary fw-semibold text-uppercase small mb-2">Billetera Digital</p>
            <h2 class="text-center fw-bold mb-4">Menú Principal</h2>

            <div class="bg-primary text-white rounded-4 p-4 text-center mb-4 shadow-sm">
              <div class="text-uppercase small opacity-75">Saldo actual</div>
              <div class="fs-2 fw-bold" id="saldo">$ 0</div>
            </div>

            <div class="d-grid gap-3">
              <a href="deposit.html" class="btn btn-success btn-lg py-3">Depositar</a>
              <a href="sendmoney.html" class="btn btn-primary btn-lg py-3">Enviar Dinero</a>
              <a href="transactions.html" class="btn btn-info btn-lg py-3">Últimos Movimientos</a>
            </div>

            <div class="text-center mt-4">
              <a href="login.html" class="link-danger text-decoration-none fw-semibold">Cerrar sesión</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/saldo.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
