<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Digital - Depositar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4">
            <a href="menu.html" class="link-secondary text-decoration-none fw-semibold d-inline-block mb-3">&larr; Volver al Menú Principal</a>
            <p class="text-center text-primary fw-semibold text-uppercase small mb-2">Billetera Digital</p>
            <h2 class="text-center fw-bold mb-4">Depositar</h2>

            <form action="menu.html" method="get">
              <div class="mb-4">
                <label for="amount" class="form-label fw-semibold">Monto a depositar</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" class="form-control" id="amount" name="amount" placeholder="0" min="0" step="1" required>
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg">Realizar depósito</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
