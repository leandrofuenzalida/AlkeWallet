<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Digital - Enviar Dinero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-11 col-sm-8 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4">
            <a href="menu.html" class="link-secondary text-decoration-none fw-semibold d-inline-block mb-3">&larr; Volver al Menú Principal</a>
            <p class="text-center text-primary fw-semibold text-uppercase small mb-2">Billetera Digital</p>
            <h2 class="text-center fw-bold mb-4">Enviar Dinero</h2>

            <form class="bg-light rounded-3 p-3 mb-3" onsubmit="return false;">
              <label for="search" class="form-label fw-semibold">Buscar en la agenda</label>
              <div class="input-group">
                <input type="text" class="form-control" id="search" name="search" placeholder="Nombre o alias del contacto">
                <button type="submit" class="btn btn-primary">Buscar</button>
              </div>
            </form>

            <div class="mb-3">
              <label for="monto" class="form-label fw-semibold">Monto a enviar</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" id="monto" placeholder="0" min="0" step="1">
              </div>
            </div>

            <ul class="list-group list-group-flush mb-3" id="listaContactos"></ul>

            <div class="d-grid">
              <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#newContactModal">
                Agregar nuevo contacto
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Agregar nuevo contacto -->
  <div class="modal fade" id="newContactModal" tabindex="-1" aria-labelledby="newContactModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newContactModalLabel">Agregar nuevo contacto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="formNuevoContacto">
            <div class="mb-3">
              <label for="contactName" class="form-label fw-semibold">Nombre completo</label>
              <input type="text" class="form-control" id="contactName" placeholder="Ej: Juan Soto">
            </div>
            <div class="mb-3">
              <label for="contactAlias" class="form-label fw-semibold">Alias / Usuario</label>
              <input type="text" class="form-control" id="contactAlias" placeholder="Ej: @juansoto">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" form="formNuevoContacto" class="btn btn-success">Guardar contacto</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/saldo.js"></script>
  <script src="js/contactos.js"></script>
  <script src="js/transacciones.js"></script>
  <script src="js/sendmoney.js"></script>
</body>
</html>
